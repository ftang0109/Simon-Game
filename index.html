<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
  <meta charset="utf-8">
  <title>Simon Game by Fred Tang</title>
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css?family=Press+Start+2P" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>

<body>
  <h1 id="level-title">Press any key/start button to Start</h1>
  <div class="container">
    <div class="row">

      <div type="button" id="green" class="btn green">
        
      </div>

      <div type="button" id="red" class="btn red">

      </div>
    </div>

    <div class="row">

      <div type="button" id="yellow" class="btn yellow">

      </div>
      <div type="button" id="blue" class="btn blue">

      </div>
    </div>
    <div class="row" id="buttongroup">
      <button type="button" id="start" class="start" >Start</button>
    </div>
  </div>
  <p id="level-status">Welcome to Simon game!</p>
  <footer id="footer">@Fred Tang</footer>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script type="text/javascript" src="./index.js"></script>

</body>

</html>
